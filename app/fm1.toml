# NEW's build settings (fm1-base's tools/build.py: ./build.sh)
name = "NEW"                   # APP_NAME is in app.h; this names the build's files: new.fwsc
id_prefix = "FM-1_48"          # package identity (each firmware its own): dev FM-1_4800, releases FM-1_48XXYYZZ
usb_manufacturer = "fm1-new"
usb_product = "NEW FM-1"
o2 = []                        # separate units compiled at -O2 (an app's DSP)
words = "words.tsv"
ble = true                     # Bluetooth MIDI (--no-ble builds without it)
ble_central = true             # and the FM-1 connects to Bluetooth MIDI devices too
# the site (tools/make_site.py, tools/publish_site.sh)
tagline = "a new firmware for the FM-1"
repo = ""
licence = "MPL-2.0"
credits = "Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."   # a sentence for the installer's footer: what your firmware is built from
